name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm.cmd ci
      - name: Run tests
        run: npm.cmd test
      - name: Package and verify VSIX
        run: npm.cmd run package:verify
      - name: Save VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ github.sha }}
          path: release/*.vsix
          if-no-files-found: error
